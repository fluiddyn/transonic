name: CI-windows

on:
  - push
  - pull_request

jobs:
  tests:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.8.8
      with:
        pixi-version: v0.47.0
        cache: false

    - name: Setup
      run: |
        pixi run install-editable

    - name: Checks
      run: |
        pixi run echo $CC
        pixi run echo $CXX
        pixi run echo $PATH
        pixi run which clang-cl.exe
        pixi run which pythran

    - name: Minimal Pythran check
      run: |
        ls -l .pixi/envs/default/Lib/site-packages/pythran
        mv .github/config.py .pixi/envs/default/Lib/site-packages/pythran
        ls -l .pixi/envs/default/Lib/site-packages/pythran
        pixi run python -c "from pythran import config as m; print(m)"
        pixi run python -c "from pythran import config as m; print(m.MODIFIED); assert m.MODIFIED"
        pixi run pythran .github/minimal_pythran.py -vv

    - name: Tests
      run: |
        pixi run pytest tests
        pixi run mpirun -np 2 pytest tests
        echo "TRANSONIC_BACKEND=python" >> $GITHUB_ENV
        pixi run pytest tests
        echo "TRANSONIC_BACKEND=numba" >> $GITHUB_ENV
        pixi run pytest tests
